<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <title>Dom Size Analyzer</title>
  <style>
    :root {
      --bg: #121826;           /* lighter than before for readability */
      --panel: #1a2233;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --chip: #263145;
      --warn: #f59e0b;
      --err: #ef4444;
      --ok: #10b981;
      --line: #2b354a;
      --card: #172035;
    }
    html,body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto; font-size:15px; }
    #app { display:flex; height:100%; }

    .sidebar {
      width: 340px; border-right: 1px solid var(--line); background: var(--panel); display:flex; flex-direction:column;
    }
    .toolbar {
      padding: 10px; display:flex; gap:8px; align-items:center; border-bottom:1px solid var(--line);
    }
    .btn {
      background:#24314a; color:var(--text); border:1px solid #344461; padding:8px 12px; border-radius:10px; cursor:pointer;
    }
    .btn:hover { border-color:#4b5f82; }
    .btn.primary { background: #2563eb; border-color:#1d4ed8; }
    .btn.ghost { background: transparent; border-color: #344461; }
    .btn.warn { background:#b45309; border-color:#92400e; }
    .btn.ok { background:#047857; border-color:#065f46; }

    .panel {
      flex:1; display:flex; flex-direction:column; overflow:hidden;
    }
    .panel-header {
      display:flex; align-items:center; justify-content:space-between;
      padding: 10px 12px; border-bottom: 1px solid var(--line); gap: 10px;
    }
    .chip { background:var(--chip); padding:6px 10px; border-radius:999px; font-size:12px; color:var(--muted); }
    .content { flex:1; display:flex; min-height:0; }
    .tree { flex:1; overflow:auto; padding:10px 14px; }
    .metrics { padding:10px 12px; overflow:auto; background: var(--panel); border-top:1px solid var(--line); }

    ul { list-style:none; padding-left:14px; margin:0; }
    li { margin: 2px 0; }
    .node {
      cursor:pointer; display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:8px; width:100%;
      font-size: 15px; line-height: 1.3;
    }
    .node:hover { background:#1b263b; }
    .node.selected { background:#1f2b44; outline:1px solid #344461; }
    .node .tag { color:#93c5fd; }
    .node .id { color:#34d399; }
    .node .cls { color:#fca5a5; }

    .small { color: var(--muted); font-size: 12px; }
    .kpi { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:6px 0; }
    .row .desc { min-width:0; flex:1 1 auto; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; } /* Prevent overflow */
    .taglist { display:flex; flex-wrap:wrap; gap:6px; }
    .tagitem { background:var(--card); border:1px dashed #2b354a; padding:4px 8px; border-radius:8px; font-size:12px; }
    .search { width:320px; max-width:420px; padding:8px 12px; border-radius:10px; border:1px solid #344461; background:#0f1a2e; color:var(--text); }

    /* Layout: sidebar contains controls + metrics */
    .sidebar-section { padding:12px; display:flex; flex-direction:column; gap:10px; }
    .sidebar-title { padding:10px 12px; border-bottom:1px solid var(--line); font-weight:600; }

  </style>
</head>
<body>
  <div id="app">
    <div class="panel">
      <div class="panel-header">
        <div style="display:flex; align-items:center; gap:8px; min-width:0">
          <span class="chip" id="statusChip">Idle</span>
          <span class="small" id="statusDetail"></span>
        </div>
        <input id="searchInput" class="search" placeholder="Search tag, #id or .class…" />
        <div style="display:flex; gap:8px">
          <button class="btn primary" id="btnAnalyze">Analyze DOM</button>
          <button class="btn" id="btnRefresh">Refresh</button>
          <button class="btn ghost" id="btnExportJson">Export JSON</button>
          <button class="btn ghost" id="btnExportCsv">Export CSV</button>
        </div>
      </div>
      <div class="content">
        <div class="tree" id="tree"></div>
      </div>
    </div>
    <div class="sidebar">
      <div class="sidebar-title">
        Controls
      </div>
      <div class="sidebar-section">
        <div class="card">
          <div class="small">History</div>
          <div style="display:flex; gap:8px; margin-top:8px">
            <button class="btn" id="btnSnapshot">Snapshot</button>
            <button class="btn" id="btnCompare">Compare last 2</button>
          </div>
          <div id="historyList" class="taglist" style="margin-top:8px"></div>
        </div>

        <div id="metrics" class="metrics card">
          <!-- Metrics will render here (moved under history) -->
        </div>
      </div>
    </div>
  </div>

  <script src="main.js" defer></script>
</body>
</html>
